<!DOCTYPE html>
<html lang="th" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0a0018">
<title>VOCAB RIDER — NEON THAILAND (Offline)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--pink:#ff2fb9;--cyan:#00e5ff;--violet:#8a2bff;--gold:#ffe600;--mint:#4dffb8;--orange:#ff8a00;
--ink:#e9f4ff;--dim:#8f9ec4;--panel:rgba(11,3,28,.68);--line:rgba(0,229,255,.22);
--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
--disp:'Arial Black',Impact,'Helvetica Neue',system-ui,sans-serif;
--body:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:#05000f;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}
body::before{content:'';position:fixed;inset:0;z-index:-3;background:
radial-gradient(ellipse 90% 55% at 50% 4%,rgba(138,43,255,.42),transparent 62%),
radial-gradient(ellipse 60% 42% at 88% 92%,rgba(255,47,185,.26),transparent 62%),
radial-gradient(ellipse 60% 42% at 6% 72%,rgba(0,229,255,.18),transparent 62%),
linear-gradient(180deg,#0b0020 0%,#14002e 42%,#05000f 100%)}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.55;background-image:
radial-gradient(1.4px 1.4px at 12% 16%,#fff,transparent),
radial-gradient(1.2px 1.2px at 68% 9%,#cfe9ff,transparent),
radial-gradient(1.6px 1.6px at 84% 28%,#ffd9f4,transparent),
radial-gradient(1.1px 1.1px at 32% 42%,#fff,transparent),
radial-gradient(1.3px 1.3px at 88% 62%,#bff6ff,transparent),
radial-gradient(1.1px 1.1px at 8% 74%,#fff,transparent),
radial-gradient(1.5px 1.5px at 46% 88%,#ffe6c9,transparent),
radial-gradient(1.1px 1.1px at 22% 58%,#fff,transparent);
animation:twinkle 4.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.75}}
.floor{position:fixed;left:-20%;right:-20%;bottom:0;height:44vh;z-index:-2;pointer-events:none;opacity:.5;
transform:perspective(330px) rotateX(68deg);transform-origin:bottom center;
background-image:linear-gradient(rgba(0,229,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,47,185,.42) 1px,transparent 1px);
background-size:46px 46px;animation:gridmove 5s linear infinite;
-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
@keyframes gridmove{to{background-position:0 46px,0 0}}
.scanlines{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.32;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.vhs{position:fixed;inset:0;z-index:69;pointer-events:none;opacity:.05;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;animation:vhsj .7s steps(3) infinite}
@keyframes vhsj{0%{transform:translateY(0)}50%{transform:translateY(2px)}100%{transform:translateY(-1px)}}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(10px,2.2vw,22px) clamp(10px,2.2vw,22px) 40px;position:relative;z-index:1}
.chrome{background:linear-gradient(180deg,#fff 0%,#d8efff 26%,#79c8ff 44%,#ff7ad9 56%,#b98cff 74%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(255,47,185,.45))}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--pink);text-transform:uppercase}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:6px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.th-sub{font-size:13px;color:#c3cfe9;letter-spacing:.02em}
h1.logo{font-family:var(--disp);font-weight:900;letter-spacing:.05em;line-height:.94;font-size:clamp(34px,8vw,60px);margin:6px 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(7px);box-shadow:0 0 0 1px rgba(255,47,185,.06) inset,0 18px 40px -24px rgba(0,229,255,.55);position:relative}
.panel+.panel{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:11px;cursor:pointer;font-family:var(--body);font-weight:800;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#f2fbff;border:1px solid rgba(0,229,255,.55);background:linear-gradient(180deg,rgba(0,229,255,.22),rgba(138,43,255,.28));transition:transform .16s,box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){box-shadow:0 0 26px rgba(0,229,255,.45),inset 0 0 22px rgba(255,47,185,.2);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.995)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pink{border-color:rgba(255,47,185,.65);background:linear-gradient(180deg,rgba(255,47,185,.3),rgba(138,43,255,.32))}
.btn.ghost{background:transparent;border-color:rgba(143,158,196,.4);color:#cfdcf5;font-weight:700}
.btn.big{font-size:14px;padding:16px 20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{width:auto;flex:1;min-width:150px}
input{width:100%;padding:13px 14px;background:rgba(4,0,14,.62);border:1px solid rgba(255,47,185,.36);border-radius:11px;color:#fff;font-family:var(--body);font-size:15px;letter-spacing:.03em}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.3)}
input::placeholder{color:#5d6b8c}
.scanner{position:relative;height:8px;border-radius:6px;background:rgba(0,229,255,.09);overflow:hidden}
.scanner i{position:absolute;top:0;height:100%;width:46px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--cyan),#fff,var(--cyan),transparent);box-shadow:0 0 14px var(--cyan);animation:scanx 1.6s ease-in-out infinite alternate}
@keyframes scanx{from{left:-46px}to{left:calc(100% - 2px)}}
.pbar{height:7px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 12px rgba(255,47,185,.7);transition:width .35s}
/* boot */
.boot{display:grid;gap:14px;padding-top:clamp(10px,4vh,44px)}
@media(min-width:880px){.boot{grid-template-columns:1.15fr .85fr;align-items:start;gap:22px}}
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.avtile{background:rgba(4,0,14,.5);border:1px solid rgba(143,158,196,.3);border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.18s;font-family:inherit}
.avtile span{font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;text-align:center;line-height:1.2}
.avtile:hover{border-color:rgba(0,229,255,.6)}
.avtile.on{border-color:var(--cyan);background:rgba(0,229,255,.12);box-shadow:0 0 18px rgba(0,229,255,.35)}
.avtile.on span{color:var(--cyan)}
.avbig{display:flex;justify-content:center;padding:6px 0 2px}
/* HUD */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{line-height:.9;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.06em}
.brand small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.34em;color:var(--dim);margin-top:6px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(11,3,28,.66);border:1px solid var(--line);border-radius:11px;padding:7px 11px;min-width:74px}
.stat span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;color:var(--dim)}
.stat b{font-family:var(--mono);font-size:15px;color:#fff;letter-spacing:.04em}
.stat b i{font-style:normal;font-size:10px;color:var(--dim)}
.who{display:flex;align-items:center;gap:9px;background:rgba(11,3,28,.66);border:1px solid rgba(255,47,185,.3);border-radius:11px;padding:6px 12px 6px 6px}
.who b{display:block;font-size:12px;letter-spacing:.08em}
.who span{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--gold)}
/* map */
.mapgrid{display:grid;gap:12px}
@media(min-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.map{position:relative;aspect-ratio:800/1100;width:100%;border:1px solid rgba(255,47,185,.35);border-radius:16px;overflow:hidden;background:#05000f;box-shadow:0 0 42px -12px rgba(255,47,185,.5)}
.map .ov{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);z-index:5;opacity:.5}
.glowline{animation:dashmove 1.6s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-32}}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3;font-family:inherit}
.node .nm{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:#ffe98a;background:rgba(4,0,14,.78);padding:1px 5px;border-radius:5px;white-space:nowrap;border:1px solid rgba(255,230,0,.24)}
.node.lock{filter:grayscale(1);opacity:.4}
.node .ring{position:absolute;border-radius:999px;pointer-events:none}
.node .ring.sel{inset:-6px;border:2px solid var(--cyan);box-shadow:0 0 18px var(--cyan);animation:pulse 1.8s ease-in-out infinite}
.node .ring.done{inset:-4px;border:2px solid var(--mint);box-shadow:0 0 12px rgba(77,255,184,.7)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.lockb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2}
.me{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1px;animation:bob 2.6s ease-in-out infinite}
.me .tag{font-family:var(--mono);font-size:6.5px;letter-spacing:.16em;color:#05000f;background:var(--gold);padding:0 4px;border-radius:4px;font-weight:700}
@keyframes bob{0%,100%{transform:translate(-50%,-52%)}50%{transform:translate(-50%,-48%)}}
.fly{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 0 6px rgba(0,229,255,.9));animation:flyx linear infinite}
@keyframes flyx{from{transform:translateX(-70px) translateY(0)}50%{transform:translateX(calc(100% + 70px)) translateY(-10px)}to{transform:translateX(-70px) translateY(0)}}
.decowrap{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.deco{position:absolute;pointer-events:none;opacity:.5;animation-name:drift;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;filter:drop-shadow(0 0 10px rgba(255,47,185,.5))}
@keyframes drift{0%{transform:translateY(0) rotate(-4deg);opacity:.32}100%{transform:translateY(-16px) rotate(5deg);opacity:.6}}
.stk{display:inline-block;vertical-align:middle;border:0;background:none;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 0 8px rgba(0,229,255,.35))}
.holo .stk{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 16px rgba(0,229,255,.6))}
.prop{display:block;margin:8px auto 0;filter:drop-shadow(0 0 14px rgba(255,47,185,.45))}
.marq{position:absolute;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(90deg,rgba(255,47,185,.9),rgba(138,43,255,.9));color:#fff;font-family:var(--mono);font-size:8px;letter-spacing:.22em;overflow:hidden;white-space:nowrap;padding:3px 0}
.marq span{display:inline-block;animation:marqz 18s linear infinite}
@keyframes marqz{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.citycard h2{font-family:var(--disp);font-size:20px;letter-spacing:.02em;line-height:1.05}
.citycard .th{font-size:12px;color:var(--dim)}
.cityhead{display:flex;gap:12px;align-items:center}
.stars{color:var(--gold);letter-spacing:.1em;font-size:16px;text-shadow:0 0 10px rgba(255,230,0,.5)}
.mode{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--pink);margin-top:10px}
.mode em{color:var(--cyan);font-style:normal}
.desc{font-size:12px;color:#a9b7d6;margin-top:4px}
.locked-note{text-align:center;font-size:12px;color:#93a1c0;border:1px dashed rgba(143,158,196,.42);border-radius:10px;padding:11px;margin-top:12px}
/* jet */
.jetbox{display:flex;gap:11px;align-items:flex-start;border:1px solid rgba(255,138,0,.42);border-radius:14px;background:linear-gradient(180deg,rgba(60,22,0,.5),rgba(11,3,28,.6));padding:11px;margin-top:12px;position:relative;overflow:hidden}
.jetbox::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,229,255,.07) 0 1px,transparent 1px 4px);pointer-events:none}
.jetbox .jt{flex:1;min-width:0}
.jetname{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.2em;color:#ffb056}
.jettext{font-size:12px;line-height:1.55;color:#e7e2d8;margin-top:3px}
.jetbtn{background:none;border:none;color:#ffb056;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-decoration:underline;cursor:pointer;margin:6px 12px 0 0;padding:0}
.jetbtn.cy{color:var(--cyan)}
.jetsvg{filter:drop-shadow(0 0 8px rgba(255,138,0,.55));flex:0 0 auto}
/* games */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;font-family:var(--mono);font-size:10px;letter-spacing:.14em}
.hud .c{color:var(--pink)}
.hud .s{color:var(--cyan)}
.hud .r{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.qbig{font-family:var(--disp);font-size:clamp(20px,5vw,32px);letter-spacing:.03em;text-align:center;color:#fff;text-shadow:0 0 22px rgba(0,229,255,.55);line-height:1.15}
.qth{font-size:clamp(17px,4.6vw,25px);text-align:center;color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.5);margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.opt{padding:13px;border:1px solid rgba(143,158,196,.4);border-radius:11px;background:rgba(6,1,20,.6);color:#fff;cursor:pointer;font-size:15px;text-align:center;font-family:inherit;transition:.16s}
.opt:hover:not(:disabled){border-color:var(--pink);box-shadow:0 0 18px rgba(255,47,185,.35)}
.opt.right{border-color:var(--mint);background:rgba(0,90,60,.4);color:#9dffd8;box-shadow:0 0 18px rgba(77,255,184,.4)}
.opt.wrongpick{border-color:#ff3b5c;background:rgba(120,0,25,.42);color:#ff9bab}
.opt.dim{opacity:.32}
.chip{padding:9px 12px;border:1px solid rgba(143,158,196,.42);border-radius:9px;background:rgba(6,1,20,.6);color:#fff;cursor:pointer;font-size:13.5px;font-family:inherit;transition:.14s}
.chip:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.chip.dim{opacity:.3;cursor:not-allowed}
.tile{width:40px;height:40px;border:1px solid rgba(143,158,196,.5);border-radius:9px;background:rgba(6,1,20,.7);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--mono);margin:2px}
.tile:hover{border-color:var(--pink);box-shadow:0 0 14px rgba(255,47,185,.4)}
.slot{width:31px;height:42px;border:1px dashed rgba(143,158,196,.42);border-radius:8px;background:rgba(4,0,14,.5);color:#5a6784;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--mono);margin:2px}
.slot.on{border-style:solid;border-color:var(--cyan);color:var(--cyan);background:rgba(0,60,70,.35);box-shadow:0 0 12px rgba(0,229,255,.4)}
.holo{width:150px;height:150px;margin:12px auto;border:1px solid var(--cyan);border-radius:18px;background:linear-gradient(180deg,rgba(0,90,110,.35),rgba(0,0,0,.85));display:flex;align-items:center;justify-content:center;font-size:76px;box-shadow:0 0 34px rgba(0,229,255,.4),inset 0 0 40px rgba(0,229,255,.18);position:relative;overflow:hidden;animation:holo 3.4s ease-in-out infinite}
@keyframes holo{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(28deg)}}
.holo::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);pointer-events:none}
.ok{color:var(--mint);font-weight:800;text-align:center}
.bad{color:#ff8497;font-weight:800;text-align:center}
.tiny{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:#616f92;text-align:center}
/* laser */
.sky{position:relative;height:min(56vh,400px);border:1px solid rgba(255,47,185,.42);border-radius:14px;overflow:hidden;background:
radial-gradient(ellipse 70% 50% at 50% 100%,rgba(255,47,185,.28),transparent 65%),
linear-gradient(180deg,#07001a,#0d0030 60%,#1a0038);touch-action:manipulation}
.sky::after{content:'';position:absolute;left:-30%;right:-30%;bottom:0;height:42%;transform:perspective(240px) rotateX(64deg);transform-origin:bottom;background-image:linear-gradient(rgba(0,229,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.42) 1px,transparent 1px);background-size:34px 34px;pointer-events:none;opacity:.65}
.sky .st{position:absolute;width:2px;height:2px;background:#fff;border-radius:2px;opacity:.8}
.ship{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;cursor:pointer;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.ship .body{font-size:15px;filter:drop-shadow(0 0 8px rgba(255,47,185,.9))}
.ship .lb{font-family:var(--mono);font-size:9px;color:#fff;background:rgba(0,0,0,.8);border:1px solid rgba(255,47,185,.7);border-radius:5px;padding:1px 5px;white-space:nowrap}
.cannon{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);z-index:4;font-size:26px;filter:drop-shadow(0 0 12px rgba(0,229,255,.95))}
.beam{position:absolute;height:3px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(0,229,255,.2),#fff);border-radius:3px;box-shadow:0 0 12px var(--cyan),0 0 26px var(--cyan);z-index:3;pointer-events:none;animation:beamf .26s ease-out forwards}
@keyframes beamf{from{opacity:1;height:5px}to{opacity:0;height:1px}}
.boom{position:absolute;transform:translate(-50%,-50%);font-size:26px;z-index:4;pointer-events:none;animation:boomf .55s ease-out forwards}
@keyframes boomf{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1)}}
/* cable */
.cablewrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:6px 0}
.cablewrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.col{display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.port{display:flex;align-items:center;gap:7px;padding:9px 10px;border:1px solid rgba(143,158,196,.42);border-radius:9px;background:rgba(6,1,20,.78);color:#fff;cursor:pointer;font-family:inherit;font-size:12.5px;transition:.15s;position:relative}
.port:hover{border-color:var(--cyan)}
.port.sel{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.5);color:var(--cyan)}
.port.done{border-color:rgba(77,255,184,.7);color:#9dffd8;opacity:.85;cursor:default}
.port .dot{width:7px;height:7px;border-radius:99px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:0 0 auto}
.col.r .port{justify-content:flex-end;text-align:right}
.port.flash{border-color:#ff3b5c;color:#ff9bab;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
/* code */
.term{background:#04010d;border:1px solid rgba(77,255,184,.35);border-radius:12px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.75;box-shadow:inset 0 0 40px rgba(77,255,184,.07);min-height:110px}
.term .kw{color:var(--pink);font-weight:700}
.term .vr{color:var(--cyan)}
.term .st{color:var(--gold)}
.term .out{color:var(--mint)}
.term .err{color:#ff6b83}
.term .prompt{color:#5a6784}
.codeline{display:block;text-align:left;width:100%;background:none;border:1px solid rgba(143,158,196,.32);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-family:var(--mono);font-size:11.5px;color:#dbe6ff;cursor:pointer;transition:.14s}
.codeline:hover{border-color:var(--cyan);background:rgba(0,229,255,.08)}
.codeline.used{opacity:.25;cursor:default}

/* Raw game script: concatenated into the standalone offline build. Shares one closure with the other game parts. */
/* ---------- 1. TUK TUK TRANSLATE ---------- */
function gMC(loc){
 var qs=shuffle(VOCAB).slice(0,10).map(function(w){
  var wrong=shuffle(VOCAB.filter(function(v){return v[0]!==w[0];})).slice(0,3).map(function(v){return v[1];});
  return {en:w[0],th:w[1],opts:shuffle(wrong.concat([w[1]]))};
 });
 var i=0,score=0,streak=0,sel=null,fb=null;
 function render(){
  var q=qs[i];
  var h=hud(loc,score,'<span style="color:#ff2fb9">🔥 '+streak+'</span>')+pbar((i+1)/qs.length*100);
  h+='<div class="card"><p class="lbl" style="text-align:center">TRANSLATE TO THAI • แปลเป็นไทย</p><h2 class="qbig">'+esc(q.en).toUpperCase()+'</h2><div class="grid2">';
  q.opts.forEach(function(o,idx){
   var cls='opt';
   if(sel!==null){if(o===q.th)cls+=' right';else if(sel===o)cls+=' wrongpick';else cls+=' dim';}
   h+='<button class="'+cls+'" data-i="'+idx+'">'+esc(o)+'</button>';
  });
  h+='</div>';
  if(fb)h+='<p class="'+(fb.ok?'ok':'bad')+'" style="margin-top:12px">'+(fb.ok?'+'+fb.pts+' POINTS!':'เฉลย: '+esc(fb.ans))+'</p>';
  h+='<p class="tiny" style="margin-top:12px">QUESTION '+(i+1)+' / '+qs.length+'</p></div>';
  app.innerHTML=h;
  var bs=app.querySelectorAll('.opt');
  for(var b=0;b<bs.length;b++){bs[b].onclick=function(){pick(qs[i].opts[parseInt(this.getAttribute('data-i'),10)]);};}
 }
 function pick(a){
  if(sel!==null)return;sel=a;var q=qs[i];
  if(a===q.th){var pts=100+streak*12;score+=pts;streak++;fb={ok:1,pts:pts};if(streak>=3)S.match();else S.correct();}
  else{streak=0;fb={ok:0,ans:q.th};S.wrong();}
  render();
  setTimeout(function(){i++;sel=null;fb=null;if(i<qs.length)render();else finish(loc,score);},1300);
 }
 render();
}

/* ---------- 2. SENTENCE BUILD ---------- */
function gSentence(loc){
 var qs=shuffle(SENT).slice(0,5).map(function(s){return {en:s[0],th:s[1]};});
 var i=0,score=0,fb=null,tleft=30,done=false,used=[],build=[],hint=null,chips=[];
 chips=shuffle(qs[0].en.split(' '));
 function render(){
  var q=qs[i];
  var h=hud(loc,score,clockHtml(tleft,7))+pbar((i+1)/qs.length*100);
  h+=jetBox(TIPS.sentence,hint,'jethint',null);
  h+='<div class="card" style="text-align:center;margin-top:10px"><p class="lbl" style="text-align:center">BUILD THE ENGLISH SENTENCE</p><h2 class="qth">'+esc(q.th)+'</h2>';
  h+='<div style="min-height:58px;border:1px dashed rgba(0,229,255,.5);border-radius:11px;background:rgba(0,229,255,.05);padding:9px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;margin-bottom:12px">';
  if(build.length===0)h+='<span class="tiny">แตะคำด้านล่างเพื่อเรียงประโยค</span>';
  build.forEach(function(w,k){h+='<button class="chip" style="border-color:#00e5ff;color:#00e5ff" data-rm="'+k+'">'+esc(w)+'</button>';});
  h+='</div><div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center">';
  chips.forEach(function(w,ci){if(used.indexOf(ci)<0)h+='<button class="chip" data-c="'+ci+'">'+esc(w)+'</button>';});
  h+='</div>';
  var full=build.length===chips.length;
  h+='<button class="btn" id="check" style="max-width:220px;margin:14px auto 0" '+((full&&!fb)?'':'disabled')+'>CHECK ▸</button>';
  if(fb)h+='<p class="'+(fb.ok?'ok':'bad')+'" style="margin-top:12px">'+(fb.ok?'+'+fb.pts+' POINTS!':'เฉลย: '+esc(fb.ans))+'</p>';
  h+='<p class="tiny" style="margin-top:10px">SENTENCE '+(i+1)+' / '+qs.length+'</p></div>';
  app.innerHTML=h;
  var cs=app.querySelectorAll('[data-c]');
  for(var a=0;a<cs.length;a++){cs[a].onclick=function(){var ci=parseInt(this.getAttribute('data-c'),10);used.push(ci);build.push(chips[ci]);S.click();render();};}
  var rs=app.querySelectorAll('[data-rm]');
  for(var b=0;b<rs.length;b++){rs[b].onclick=function(){var k=parseInt(this.getAttribute('data-rm'),10);used.splice(k,1);build.splice(k,1);S.click();render();};}
  document.getElementById('check').onclick=function(){submit(false);};
  document.getElementById('jethint').onclick=function(){
   S.click();
   var words=q.en.split(' ');
   hint='เริ่มด้วยประธาน: "'+words[0]+(words[1]?' '+words[1]:'')+'" แล้วตามด้วยกริยา — อย่าลืมว่าภาษาอังกฤษเรียง ประธาน+กริยา+กรรม';
   render();
  };
 }
 function submit(timed){
  if(fb||done)return;
  var q=qs[i];
  var ok=!timed&&build.join(' ')===q.en;
  if(ok){var pts=250+tleft*6;score+=pts;fb={ok:1,pts:pts};S.correct();}
  else{fb={ok:0,ans:q.en};S.wrong();}
  render();

  else{
   var pool=VOCAB.filter(function(v){return v[1]!==t[1]&&!ships.some(function(s){return s.th===v[1];});});
   if(pool.length)th=pool[Math.floor(Math.random()*pool.length)][1];

  b.style.left='50%';b.style.top='100%';

/* ---------- NEON EVIDENCE ---------- */
/* Draws pictures the player has not seen yet, so every debate photo gets used. */
function artPool() {
  var seen = state.artSeen || [];
  var fresh = ARTQ.filter(function (a) { return seen.indexOf(a[1]) < 0; });
  if (fresh.length < 8) { state.artSeen = []; fresh = ARTQ.slice(); }
  return shuffle(fresh).slice(0, 8);
}

function gPicture(loc) {
  var qs = artPool().map(function (a) {
    var wrong = shuffle(ARTQ.filter(function (b) { return b[1] !== a[1]; })).slice(0, 3).map(function (b) { return b[1]; });
    return { img: a[1], word: a[0], th: a[2], opts: shuffle(wrong.concat([a[0]])) };
  });
  var i = 0, score = 0, sel = null, fb = null;

  function render() {
    var q = qs[i];
    var h = hud(loc, score, '<span style="color:#4dffb8">ART ' + (i + 1) + '/' + qs.length + '</span>')
      + pbar((i + 1) / qs.length * 100);
    h += '<div class="card" style="text-align:center"><p class="lbl" style="text-align:center">NEON EVIDENCE • WHAT DOES THIS SHOW?</p>';
    h += '<div class="holopic"><img src="' + ASSET_BASE + q.img + '.jpg" alt="" draggable="false"><span class="holoscan"></span></div>';
    h += '<div class="grid2">';
    q.opts.forEach(function (o, idx) {
      var cls = 'opt';
      if (sel !== null) { if (o === q.word) cls += ' right'; else if (sel === o) cls += ' wrongpick'; else cls += ' dim'; }
      h += '<button class="' + cls + '" data-i="' + idx + '">' + esc(o) + '</button>';
    });
    h += '</div>';
    if (fb) h += '<p class="' + (fb.ok ? 'ok' : 'bad') + '" style="margin-top:12px">' + (fb.ok ? '+' + fb.pts + ' POINTS!' : 'เฉลย: ' + esc(fb.ans) + ' • ' + esc(fb.th)) + '</p>';
    h += '<p class="tiny" style="margin-top:12px">PICTURE ' + (i + 1) + ' / ' + qs.length + '</p></div>';
    app.innerHTML = h;
    var bs = app.querySelectorAll('.opt');
    for (var b = 0; b < bs.length; b++) {
      bs[b].onclick = function () { pick(qs[i].opts[parseInt(this.getAttribute('data-i'), 10)]); };
    }
  }

  function pick(a) {
    if (sel !== null) return;
    sel = a;
    var q = qs[i];
    state.artSeen = (state.artSeen || []).concat([q.img]);
    save();
    if (a === q.word) { score += 175; fb = { ok: 1, pts: 175 }; S.correct(); }
    else { fb = { ok: 0, ans: q.word, th: q.th }; S.wrong(); }
    render();
    setTimeout(function () {
      i++; sel = null; fb = null;
      if (i < qs.length) render(); else finish(loc, score);
    }, 1400);
  }
  render();
}

/* Draws stickers the player has not seen yet, so the whole pack gets used. */
function stickerPool(n) {
  n = n || 8;
  var seen = state.stickSeen || [];
  var fresh = STICKQ.filter(function (a) { return seen.indexOf(a[0]) < 0; });
  if (fresh.length < n) { state.stickSeen = []; fresh = STICKQ.slice(); }
  return shuffle(fresh).slice(0, n);
}

function stickerDistractors(row) {
  return shuffle(STICKQ.filter(function (b) { return b[1] !== row[1]; })).slice(0, 3);
}

/* Rounds mix three question shapes: name the sticker, find the sticker, Thai meaning. */
function stickerQuestions(n) {
  return stickerPool(n).map(function (a, idx) {
    var others = stickerDistractors(a);
    var type = idx % 3;
    var q = { type: type, img: a[0], word: a[1], th: a[2] };
    if (type === 0) q.opts = shuffle(others.map(function (b) { return b[1]; }).concat([a[1]]));
    else if (type === 1) q.picks = shuffle(others.concat([a]));
    else q.opts = shuffle(others.map(function (b) { return b[2]; }).concat([a[2]]));
    return q;
  });
}

function gSticker(loc) {
  var qs = stickerQuestions(8);
  var i = 0, score = 0, sel = null, fb = null;

  function render() {
    var q = qs[i];
    var h = hud(loc, score, '<span style="color:#4dffb8">CARD ' + (i + 1) + '/' + qs.length + '</span>')
      + pbar((i + 1) / qs.length * 100);
    h += '<div class="card" style="text-align:center"><p class="lbl" style="text-align:center">';
    h += q.type === 1 ? 'STICKER STORM • FIND THIS STICKER' : q.type === 2 ? 'STICKER STORM • ความหมายไทย' : 'STICKER STORM • NAME THIS STICKER';
    h += '</p>';

    if (q.type === 1) {
      h += '<p class="shootq" style="margin-bottom:2px">' + esc(q.word.toUpperCase()) + '</p>';
      h += '<p class="shootsub">' + esc(q.th) + ' — แตะสติกเกอร์ที่ตรงกับคำนี้</p>';
      h += '<div class="pickgrid">';
      q.picks.forEach(function (p, idx) {
        var cls = 'pickstk';
        if (sel !== null) { if (p[0] === q.img) cls += ' right'; else if (sel === p[0]) cls += ' wrongpick'; else cls += ' dim'; }
        h += '<button class="' + cls + '" data-i="' + idx + '">' + sticker(p[0], 76) + '</button>';
      });
      h += '</div>';
    } else {
      h += '<div class="stkstage">' + sticker(q.img, 150) + '<span class="stickrack"></span></div>';
      var correct = q.type === 2 ? q.th : q.word;
      h += '<div class="grid2">';
      q.opts.forEach(function (o, idx) {
        var cls = 'opt';
        if (sel !== null) { if (o === correct) cls += ' right'; else if (sel === o) cls += ' wrongpick'; else cls += ' dim'; }
        h += '<button class="' + cls + '" data-i="' + idx + '">' + esc(o) + '</button>';
      });
      h += '</div>';
    }

    if (fb) h += '<p class="' + (fb.ok ? 'ok' : 'bad') + '" style="margin-top:12px">' + (fb.ok ? '+' + fb.pts + ' POINTS!' : 'เฉลย: ' + esc(fb.ans) + ' • ' + esc(fb.th)) + '</p>';
    h += '<p class="tiny" style="margin-top:12px">STICKER ' + (i + 1) + ' / ' + qs.length + '</p></div>';
    app.innerHTML = h;

    var bs = app.querySelectorAll('[data-i]');
    for (var b = 0; b < bs.length; b++) {
      bs[b].onclick = function () {
        var n = parseInt(this.getAttribute('data-i'), 10);
        pick(q.type === 1 ? q.picks[n][0] : q.opts[n]);
      };
    }
  }

  function pick(a) {
    if (sel !== null) return;
    sel = a;
    var q = qs[i];
    state.stickSeen = (state.stickSeen || []).concat([q.img]);
    save();
    if (a === (q.type === 1 ? q.img : (q.type === 2 ? q.th : q.word))) { score += 140; fb = { ok: 1, pts: 140 }; S.correct(); }
    else { fb = { ok: 0, ans: q.word, th: q.th }; S.wrong(); }
    render();
    setTimeout(function () {
      i++; sel = null; fb = null;
      if (i < qs.length) render(); else finish(loc, score);
    }, 1400);
  }

  render();
}

  });

    if (ok) {

    } else {

      }

}
